name: Applicant data retention

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  purge-expired-applications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Purge finalized applications past the retention period
        env:
          RETENTION_PURGE_TOKEN: ${{ secrets.RETENTION_PURGE_TOKEN }}
        run: |
          test -n "$RETENTION_PURGE_TOKEN"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --request POST \
            --header "X-Retention-Token: ${RETENTION_PURGE_TOKEN}" \
            "https://applicant-tracking-system-tbaw.onrender.com/applications/retention/purge"
