name: Applicant data retention

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  purge-expired-applications:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/redesign'
    environment: ${{ github.ref == 'refs/heads/redesign' && 'staging' || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Purge finalized applications past the retention period
        env:
          RETENTION_PURGE_TOKEN: ${{ secrets.RETENTION_PURGE_TOKEN }}
        run: |
          test -n "$RETENTION_PURGE_TOKEN"
          case "$GITHUB_REF" in
            refs/heads/redesign) retention_api="https://applicant-tracking-system-1-0g5l.onrender.com" ;;
            refs/heads/main) retention_api="https://applicant-tracking-system-tbaw.onrender.com" ;;
            *) echo "Unsupported branch for retention purge" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --request POST \
            --header "X-Retention-Token: ${RETENTION_PURGE_TOKEN}" \
            "${retention_api}/applications/retention/purge"
