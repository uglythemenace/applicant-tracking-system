<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS - Recruiter Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <div class="max-w-6xl mx-auto space-y-8">
        <!-- Header -->
        <header class="flex justify-between items-center bg-white p-6 rounded-lg shadow-sm">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Recruiter Dashboard</h1>
                <p class="text-gray-500">Applicant Tracking System</p>
            </div>
            <button onclick="fetchApplications()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-md transition">
                Refresh Applicants
            </button>
        </header>

        <!-- New Application Form (POST Endpoint) -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Submit New Application</h2>
            <form id="create-app-form" onsubmit="submitApplication(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Candidate Name</label>
                    <input type="text" id="candidate_name" required placeholder="John Doe" class="mt-1 block w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com" class="mt-1 block w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Job ID</label>
                    <input type="number" id="job_id" required value="1" class="mt-1 block w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Resume Link (URL)</label>
                    <input type="url" id="resume_url" placeholder="https://example.com/resume.pdf" class="mt-1 block w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-md transition">
                        Submit Application
                    </button>
                </div>
            </form>
        </div>

        <!-- Applicants Table Container -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden border border-gray-200">
            <div class="p-6 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-gray-800">Candidate Applications</h2>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            <th class="py-3 px-6">ID</th>
                            <th class="py-3 px-6">Candidate Name</th>
                            <th class="py-3 px-6">Email</th>
                            <th class="py-3 px-6">Job ID</th>
                            <th class="py-3 px-6">Resume</th>
                            <th class="py-3 px-6">Status</th>
                            <th class="py-3 px-6">Action</th>
                        </tr>
                    </thead>
                    <tbody id="applications-table-body" class="divide-y divide-gray-200 text-sm text-gray-700">
                        <!-- Dynamic rows loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000';

        // 1. Fetch all applications from backend
        async function fetchApplications() {
            const tableBody = document.getElementById('applications-table-body');
            tableBody.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-gray-500">Loading applicants...</td></tr>';

            try {
                const response = await fetch(`${API_BASE_URL}/applications/`);
                if (!response.ok) throw new Error('Failed to load applications');

                const applications = await response.json();
                renderTable(applications);
            } catch (error) {
                console.error('Error fetching applications:', error);
                tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-red-500">Error loading data. Is the backend server running?</td></tr>`;
            }
        }

        // 2. Render rows dynamically in HTML table
        function renderTable(applications) {
            const tableBody = document.getElementById('applications-table-body');
            tableBody.innerHTML = '';

            if (applications.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-gray-500">No applications found.</td></tr>';
                return;
            }

            applications.forEach(app => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition';

                const resumeLink = app.resume_url 
                    ? `<a href="${app.resume_url}" target="_blank" class="text-blue-600 hover:underline">View Resume</a>` 
                    : '<span class="text-gray-400">N/A</span>';

                row.innerHTML = `
                    <td class="py-4 px-6 font-mono text-gray-500">#${app.id}</td>
                    <td class="py-4 px-6 font-medium text-gray-900">${app.candidate_name}</td>
                    <td class="py-4 px-6 text-gray-600">${app.email}</td>
                    <td class="py-4 px-6 text-gray-600">${app.job_id}</td>
                    <td class="py-4 px-6">${resumeLink}</td>
                    <td class="py-4 px-6">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold capitalize ${getStatusBadgeClass(app.status)}">
                            ${app.status}
                        </span>
                    </td>
                    <td class="py-4 px-6">
                        <select onchange="updateStatus(${app.id}, this.value)" class="border border-gray-300 rounded px-2 py-1 text-xs focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Change status...</option>
                            <option value="pending">Pending</option>
                            <option value="interviewing">Interviewing</option>
                            <option value="accepted">Accepted</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </td>
                `;

                tableBody.appendChild(row);
            });
        }

        function getStatusBadgeClass(status) {
            switch (status.toLowerCase()) {
                case 'interviewing': return 'bg-yellow-100 text-yellow-800';
                case 'accepted': return 'bg-green-100 text-green-800';
                case 'rejected': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // 3. Update status (PATCH)
        async function updateStatus(applicationId, newStatus) {
            try {
                const response = await fetch(`${API_BASE_URL}/applications/${applicationId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!response.ok) {
                    alert('Failed to update status.');
                    return;
                }
                fetchApplications();
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        // 4. Create new application (POST)
        async function submitApplication(event) {
            event.preventDefault();

            const payload = {
                candidate_name: document.getElementById('candidate_name').value,
                email: document.getElementById('email').value,
                job_id: parseInt(document.getElementById('job_id').value),
                resume_url: document.getElementById('resume_url').value || null
            };

            try {
                const response = await fetch(`${API_BASE_URL}/applications/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    alert('Failed to submit application. Make sure the Job ID exists!');
                    return;
                }

                // Reset form & reload applicants table
                document.getElementById('create-app-form').reset();
                fetchApplications();
            } catch (error) {
                console.error('Error submitting application:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchApplications);
    </script>
</body>
</html>
