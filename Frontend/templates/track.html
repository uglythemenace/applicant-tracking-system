<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check my application | Learn2earn</title>
  <link rel="stylesheet" href="/Frontend/static/style.css">
</head>
<body data-page="track">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <div class="wrap wrap-narrow">
      <div class="page-head">
        <h1>Check my application</h1>
        <p>Enter the email you applied with and the tracking code we gave you after you applied.</p>
      </div>

      <form id="track-form" class="panel" novalidate>
        <div class="field">
          <label for="email">Your email address</label>
          <input id="email" type="email" required autocomplete="email" inputmode="email" placeholder="For example: maria@example.com">
        </div>
        <div class="field">
          <label for="code">Your tracking code</label>
          <span class="hint" id="h-code">It starts with L2E- and has 8 more letters and numbers.</span>
          <input id="code" type="text" required autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="L2E-XXXXXXXX" aria-describedby="h-code" style="text-transform:uppercase;letter-spacing:0.05em;font-family:var(--mono)">
        </div>
        <button id="submit-btn" type="submit" class="btn btn-primary btn-block">Check my application</button>
      </form>

      <div id="result" role="status" aria-live="polite" aria-atomic="true"></div>
      <p class="muted" style="margin-top:24px">Lost your code? We cannot look it up for you yet. Contact the hiring team at the company that posted the job.</p>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script src="/Frontend/static/script.js"></script>
  <script>
    // The steps an application moves through, in order.
    const STEPS = ['Application received', 'Being reviewed', 'Interview stage', 'Decision made'];

    // Turns the saved status into a step and a plain-language message.
    function describeStatus(raw) {
      const s = String(raw || '').trim().toLowerCase();
      if (['accepted', 'hired', 'approved'].includes(s))
        return { step: 3, tone: 'good', decision: 'Accepted', title: 'Good news: you have been accepted.', message: 'The hiring team will email you with the next steps. Watch your inbox, and your spam folder too.' };
      if (['offer', 'offered'].includes(s))
        return { step: 3, tone: 'good', decision: 'Offer made', title: 'You have an offer.', message: 'The hiring team will email you with the next steps.' };
      if (['rejected', 'declined', 'not selected', 'unsuccessful'].includes(s))
        return { step: 3, tone: 'bad', decision: 'Not selected', title: 'Not selected this time', message: 'Thank you for applying. The team could not move your application forward. We hope you will apply for other jobs.' };
      if (['interview', 'interviewing', 'shortlisted', 'interview scheduled'].includes(s))
        return { step: 2, tone: 'info', title: 'Interview stage', message: 'You made the short list. Watch your email for interview details.' };
      if (['reviewing', 'under review', 'in review', 'review'].includes(s))
        return { step: 1, tone: 'info', title: 'Being reviewed', message: 'The hiring team is looking at your application now. You do not need to do anything.' };
      if (['pending', 'submitted', 'received', 'new', ''].includes(s))
        return { step: 0, tone: 'warn', title: 'Waiting for review', message: 'We have your application. The hiring team has not looked at it yet. You do not need to do anything.' };
      return { step: null, tone: 'info', title: String(raw), message: 'This is the latest update on your application.' };
    }

    const result = document.getElementById('result');

    function showAlert(tone, title, text, extra) {
      result.replaceChildren(L2E.el('div', { class: 'alert alert-' + tone }, L2E.el('strong', { text: title }), text ? L2E.el('p', { text }) : null, extra));
    }

    function renderResult(data) {
      const info = describeStatus(data.status);
      const labels = STEPS.map((label, i) => (i === 3 && info.step === 3 ? info.decision : label));

      // The server only reports the current stage, not the history, so only the
      // current stage is marked. We never claim an earlier stage was completed.
      const stages = labels.map((label, i) => {
        const current = i === info.step;
        return L2E.el('li', current ? { 'aria-current': 'step' } : {},
          L2E.el('span', { class: 'dot' + (current ? ' is-current is-' + (info.tone === 'warn' ? 'info' : info.tone) : ''), 'aria-hidden': 'true' }),
          L2E.el('p', { class: 'stage-label' }, label, current ? L2E.el('span', { class: 'sr-only', text: ' (current stage)' }) : null));
      });

      result.replaceChildren(L2E.el('div', { class: 'panel stack', style: 'margin-top:24px' },
        L2E.el('div', {},
          L2E.el('p', { class: 'muted', style: 'margin:0', text: 'You applied for' }),
          L2E.el('h2', { style: 'margin:0', text: data.job_title }),
          data.applied_at ? L2E.el('p', { class: 'muted', style: 'margin:4px 0 0', text: 'Sent on ' + L2E.formatDate(data.applied_at) }) : null),
        L2E.el('div', { class: 'alert alert-' + info.tone, style: 'margin:0' },
          L2E.el('strong', { text: info.title }), L2E.el('p', { text: info.message })),
        L2E.el('div', {},
          L2E.el('p', { class: 'muted', text: 'Where you are in the process. Some stages may be skipped.' }),
          L2E.el('ol', { class: 'stages' }, stages))
      ));
      result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function checkStatus(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const code = document.getElementById('code').value.trim();
      const button = document.getElementById('submit-btn');
      if (!email || !code) {
        showAlert('bad', 'Enter both your email and your tracking code.');
        (email ? document.getElementById('code') : document.getElementById('email')).focus();
        return;
      }
      button.disabled = true;
      button.textContent = 'Checking…';
      showAlert('info', 'Looking up your application…');
      try {
        const response = await L2E.request('/applications/track', {
          method: 'POST', body: { email, code }, cache: 'no-store',
          onSlow: () => showAlert('info', 'Still looking…', L2E.WAKE_NOTE)
        });
        if (response.status === 404) {
          showAlert('bad', "We couldn't find that application.", 'Check that your email and code are typed exactly as before. The code is on the screen you saw after applying.');
          return;
        }
        if (!response.ok) throw new Error('Request failed');
        renderResult(await response.json());
      } catch (error) {
        console.error('Tracking error:', error);
        showAlert('bad', 'Something went wrong on our side.', 'Wait a few seconds and press the button again. Your application is safe.');
      } finally {
        button.disabled = false;
        button.textContent = 'Check my application';
      }
    }

    document.getElementById('track-form').addEventListener('submit', checkStatus);

    // Pick up the code placed in this tab after a successful application.
    try {
      const saved = sessionStorage.getItem('learn2earn-tracking-code');
      if (saved) document.getElementById('code').value = saved;
      sessionStorage.removeItem('learn2earn-tracking-code');
    } catch (error) { /* the person can type the code */ }

    // Old shared links may carry the code or email. Use them, then remove them from the address bar.
    const params = new URLSearchParams(window.location.search);
    if (params.has('code') || params.has('email')) {
      if (params.get('code')) document.getElementById('code').value = params.get('code');
      if (params.get('email')) document.getElementById('email').value = params.get('email');
      params.delete('code');
      params.delete('email');
      const remaining = params.toString();
      history.replaceState(null, '', location.pathname + (remaining ? '?' + remaining : '') + location.hash);
    }
  </script>
</body>
</html>
