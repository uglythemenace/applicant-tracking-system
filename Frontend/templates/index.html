<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn2earn ATS - Careers</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    
    <!-- Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 p-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Learn2earn Careers</h1>
                <p class="text-sm text-slate-400">Join our team and build the future</p>
            </div>
            <div>
                <a href="/admin" class="text-sm bg-slate-800 px-4 py-2 rounded-lg hover:bg-slate-700 text-slate-300">Recruiter Portal</a>
            </div>
        </div>
    </header>

    <!-- Main Content: Job Application Form -->
    <main class="max-w-3xl mx-auto w-full p-6 my-auto space-y-6">
        <div class="bg-slate-900 p-8 rounded-xl border border-slate-800 shadow-xl">
            <h2 class="text-xl font-semibold mb-2">Submit Your Application</h2>
            <p class="text-sm text-slate-400 mb-6">Fill in your details below to apply for an open position.</p>

            <form id="apply-form" onsubmit="submitApplication(event)" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Full Name</label>
                    <input type="text" id="candidate-name" required placeholder="e.g. Sarah Jenkins" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
                    <input type="email" id="candidate-email" required placeholder="e.g. sarah@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Job Reference ID</label>
                    <input type="number" id="job-id" required value="1" min="1" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-lg transition duration-200">
                    Submit Application
                </button>
            </form>

            <div id="status-message" class="mt-4 text-center text-sm font-medium hidden"></div>
        </div>
    </main>

    <script>
        const API_BASE = "https://applicant-tracking-system-tbaw.onrender.com";

        async function submitApplication(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            const msg = document.getElementById('status-message');

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";
            msg.classList.add('hidden');

            const payload = {
                name: document.getElementById('candidate-name').value,
                email: document.getElementById('candidate-email').value,
                job_id: parseInt(document.getElementById('job-id').value)
            };

            try {
                const response = await fetch(`${API_BASE}/applicants/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    msg.innerText = "Application submitted successfully!";
                    msg.className = "mt-4 text-center text-sm font-medium text-emerald-400 block";
                    document.getElementById('apply-form').reset();
                } else {
                    throw new Error("Submission failed");
                }
            } catch (err) {
                msg.innerText = "Error submitting application. Please try again.";
                msg.className = "mt-4 text-center text-sm font-medium text-rose-400 block";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Application";
            }
        }
    </script>
</body>
</html>
