<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open jobs | Learn2earn</title>
  <link rel="stylesheet" href="/Frontend/static/style.css">
</head>
<body data-page="jobs">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <div class="wrap">
      <div class="page-head">
        <h1>Open jobs</h1>
        <p>Choose a job to read more, then select Apply. It takes about five minutes.</p>
      </div>

      <div class="filters">
        <div class="field">
          <label for="search">Search jobs</label>
          <input id="search" type="search" placeholder="Type a job title or a word" autocomplete="off">
        </div>
        <div class="field">
          <label for="dept">Type of work</label>
          <select id="dept"><option value="">All types of work</option></select>
        </div>
      </div>

      <p class="count-line" id="count-line" role="status" aria-live="polite"></p>
      <div id="notice" aria-live="polite"></div>
      <div id="jobs-container" class="job-list" aria-busy="true">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script src="/Frontend/static/script.js"></script>
  <script>
    const container = document.getElementById('jobs-container');
    const notice = document.getElementById('notice');
    const countLine = document.getElementById('count-line');
    const search = document.getElementById('search');
    const dept = document.getElementById('dept');
    let allJobs = [];

    function jobCard(job) {
      const desc = L2E.el('p', { class: 'job-desc', id: 'desc-' + job.id, text: job.description });
      const more = L2E.el('button', { type: 'button', class: 'link-btn', 'aria-expanded': 'false', 'aria-controls': 'desc-' + job.id, text: 'Read the full description' });
      more.addEventListener('click', () => {
        const open = desc.classList.toggle('is-open');
        more.setAttribute('aria-expanded', String(open));
        more.textContent = open ? 'Show less' : 'Read the full description';
      });
      return L2E.el('div', { class: 'job' },
        L2E.el('div', { class: 'job-head' },
          L2E.el('h2', { text: job.title }),
          L2E.el('span', { class: 'pill', text: job.department || 'General' })),
        desc,
        (job.description || '').length > 160 ? more : null,
        L2E.el('a', { class: 'btn btn-primary', href: '/apply?job=' + encodeURIComponent(job.id), 'aria-label': 'Apply for ' + job.title, text: 'Apply for this job' })
      );
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      const d = dept.value;
      const shown = allJobs.filter(j =>
        (!d || (j.department || 'General') === d) &&
        (!q || (j.title + ' ' + j.description + ' ' + (j.department || '')).toLowerCase().includes(q)));
      container.replaceChildren();
      container.setAttribute('aria-busy', 'false');
      if (allJobs.length === 0) {
        countLine.textContent = '';
        container.append(L2E.el('div', { class: 'alert alert-info' },
          L2E.el('strong', { text: 'No jobs are open right now.' }),
          L2E.el('p', { text: 'New jobs are added often. Check back soon.' })));
        return;
      }
      countLine.textContent = shown.length === 1 ? 'Showing 1 job' : 'Showing ' + shown.length + ' jobs';
      if (shown.length === 0) {
        container.append(L2E.el('div', { class: 'alert alert-info' },
          L2E.el('strong', { text: 'No jobs match your search.' }),
          L2E.el('p', { text: 'Try a shorter word, or choose "All types of work".' })));
        return;
      }
      shown.forEach(j => container.append(jobCard(j)));
    }

    async function load() {
      notice.replaceChildren();
      container.setAttribute('aria-busy', 'true');
      container.replaceChildren(L2E.el('div', { class: 'skeleton' }), L2E.el('div', { class: 'skeleton' }), L2E.el('div', { class: 'skeleton' }));
      try {
        allJobs = await L2E.loadOpenJobs(() => {
          notice.replaceChildren(L2E.el('div', { class: 'alert alert-info', text: L2E.WAKE_NOTE }));
        });
        notice.replaceChildren();
        const names = [...new Set(allJobs.map(j => j.department || 'General'))].sort();
        dept.replaceChildren(L2E.el('option', { value: '', text: 'All types of work' }), ...names.map(n => L2E.el('option', { value: n, text: n })));
        render();
      } catch (err) {
        container.replaceChildren();
        container.setAttribute('aria-busy', 'false');
        const retry = L2E.el('button', { type: 'button', class: 'btn btn-primary', text: 'Try again' });
        retry.addEventListener('click', load);
        notice.replaceChildren(L2E.el('div', { class: 'alert alert-warn' },
          L2E.el('strong', { text: "We couldn't load the jobs." }),
          L2E.el('p', { text: 'Your internet may be down, or the server may still be waking up. Wait a few seconds, then try again.' }),
          retry));
      }
    }

    search.addEventListener('input', render);
    dept.addEventListener('change', render);
    load();
  </script>
</body>
</html>
