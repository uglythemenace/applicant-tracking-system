<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn2earn ATS - Open Positions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 sm:p-8 selection:bg-blue-600 selection:text-white">

    <div class="max-w-6xl mx-auto space-y-8">

        <header class="flex flex-col sm:flex-row justify-between items-center bg-gray-900/80 backdrop-blur-md p-6 rounded-2xl border border-gray-800 shadow-xl gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-lg shadow-blue-600/20 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-white tracking-tight">Learn2earn Careers</h1>
                    <p class="text-xs text-gray-400">Open positions</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-3">
                <a href="/" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-semibold px-4 py-2.5 rounded-xl transition border border-gray-700">Home</a>
                <a href="/post-job" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-semibold px-4 py-2.5 rounded-xl transition border border-gray-700">Post a Job</a>
                <button onclick="fetchJobs()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-lg shadow-blue-600/20 transition">Refresh Jobs</button>
            </div>
        </header>

        <div class="bg-gray-900/80 backdrop-blur-md rounded-2xl shadow-xl border border-gray-800 overflow-hidden">
            <div class="p-6 border-b border-gray-800">
                <h2 class="text-xl font-bold text-white">Open Positions</h2>
                <p class="text-sm text-gray-400 mt-1">Pick a role and apply. We'll review your application and get back to you.</p>
            </div>
            <div id="jobs-container" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://applicant-tracking-system-tbaw.onrender.com';

        // Stops job text from being treated as HTML code
        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        async function fetchJobs() {
            const container = document.getElementById('jobs-container');
            container.innerHTML = '<p class="text-gray-400 text-sm py-4">Loading open positions...</p>';

            try {
                const response = await fetch(`${API_BASE_URL}/jobs/?status=approved`);
                if (!response.ok) throw new Error('Failed to fetch jobs');
                const data = await response.json();
                renderJobs(Array.isArray(data) ? data : (data.jobs || []));
            } catch (error) {
                console.error('Error fetching jobs:', error);
                container.innerHTML = '<p class="text-red-400 text-sm py-4">Could not load jobs. The server may be waking up. Wait a moment and click Refresh Jobs.</p>';
            }
        }

        function renderJobs(jobs) {
            const container = document.getElementById('jobs-container');
            container.innerHTML = '';

            if (jobs.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-sm py-4">No open positions right now. Please check back soon.</p>';
                return;
            }

            jobs.forEach(job => {
                const card = document.createElement('div');
                card.className = 'border border-gray-800 rounded-xl p-5 bg-gray-950 hover:border-gray-700 transition flex flex-col';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3 gap-3">
                        <h3 class="font-bold text-base text-white">${esc(job.title)}</h3>
                        <span class="text-xs bg-blue-950 text-blue-400 border border-blue-900/50 font-semibold px-2.5 py-1 rounded-lg whitespace-nowrap">${esc(job.department || 'General')}</span>
                    </div>
                    <p class="text-sm text-gray-400 whitespace-pre-line leading-relaxed flex-1">${esc(job.description)}</p>
                    <a href="/?job=${encodeURIComponent(job.id)}" class="mt-5 text-center bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold py-2.5 rounded-xl shadow-lg shadow-blue-600/20 transition">Apply Now</a>
                `;
                container.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', fetchJobs);
    </script>
</body>
</html>
