<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Learn2earn Careers</title><link rel="stylesheet" href="/Frontend/static/style.css">
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to main content</a><header id="site-header" class="site-header"></header>
  <main id="main"><div class="wrap wrap-narrow">
    <div class="page-head"><p class="hero-kicker">WE’RE HERE TO HELP</p><h1>Contact the hiring team</h1><p>For questions about an application or privacy request, contact the team that manages Learn2earn Careers.</p></div>
    <section class="panel"><h2>Hiring team</h2><p id="contact-result" role="status" aria-live="polite">Loading contact details…</p></section>
    <p><a href="/privacy">Read our privacy notice</a></p>
  </div></main>
  <footer id="site-footer" class="site-footer"></footer><script src="/Frontend/static/script.js"></script>
  <script>
    (async () => {
      const target = document.getElementById('contact-result');
      try {
        const response = await L2E.request('/site-info');
        if (!response.ok) throw new Error();
        const data = await response.json();
        if (!data.contact_email) { target.textContent = 'Contact details are not configured yet. Please use the contact information provided by the organization that posted the role.'; return; }
        target.replaceChildren('Email us at ', L2E.el('a', { href: 'mailto:' + data.contact_email, text: data.contact_email }));
      } catch (error) { target.textContent = 'Contact details could not be loaded. Please try again later.'; }
    })();
  </script>
</body></html>
